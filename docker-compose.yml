services:
  api:
    build: .
    image: ppe-detection:latest
    container_name: ppe-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      # Frontend statis di-mount supaya edit web/index.html langsung kelihatan
      # setelah refresh browser, tanpa rebuild image.
      - ./web:/app/web
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    image: ppe-detection:latest
    container_name: ppe-ui
    depends_on:
      - api
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - PPE_API_URL=http://api:8000
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
